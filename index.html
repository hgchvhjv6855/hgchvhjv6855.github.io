<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯撒加密解密工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        textarea, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
        }
        textarea {
            min-height: 120px;
            padding-right: 45px;
        }
        .copy-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            padding: 6px 10px;
            border: none;
            border-radius: 3px;
            background-color: #34a853;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .copy-btn:hover {
            background-color: #2d8f46;
        }
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .offset-buttons button:nth-child(1) {
            background-color: #4285f4;
        }
        .offset-buttons button:nth-child(1):hover {
            background-color: #3367d6;
        }
        .offset-buttons button:nth-child(2) {
            background-color: #ea4335;
        }
        .offset-buttons button:nth-child(2):hover {
            background-color: #d93025;
        }
        .extra-buttons button {
            background-color: #fbbc05;
        }
        .extra-buttons button:hover {
            background-color: #eaaa00;
        }
        #result {
            background-color: #f8f9fa;
            border: 1px solid #eee;
        }
        .tip {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 15px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>凯撒加密解密工具</h1>
        <div class="form-group">
            <label>输入文本</label>
            <div class="input-wrapper">
                <textarea id="inputText" placeholder="请输入要加密或解密的文本..."></textarea>
                <button class="copy-btn" onclick="copyText('inputText')">复制</button>
            </div>
        </div>
        <div class="form-group">
            <label for="offset">偏移位数（1-25）</label>
            <input type="number" id="offset" min="1" max="25" value="3">
        </div>
        <div class="buttons offset-buttons">
            <button onclick="shiftLeft()">向左偏移</button>
            <button onclick="shiftRight()">向右偏移</button>
        </div>
        <div class="buttons extra-buttons">
            <button onclick="clearAll()">清空</button>
        </div>
        <div class="form-group">
            <label>结果</label>
            <div class="input-wrapper">
                <textarea id="result" readonly placeholder="结果将显示在这里..."></textarea>
                <button class="copy-btn" onclick="copyText('result')">复制</button>
            </div>
        </div>
        <p class="tip"></p>
    </div>
    <div class="toast" id="toast">复制成功</div>

    <script>
        // 向左偏移（核心功能：字母表左移，如d->c->b->a）
        function shiftLeft() {
            const inputText = document.getElementById('inputText').value;
            const offset = parseInt(document.getElementById('offset').value);
            if (!validateOffset(offset)) return;
            let result = '';
            for (let i = 0; i < inputText.length; i++) {
                let char = inputText[i];
                if (char >= 'a' && char <= 'z') {
                    result += String.fromCharCode((char.charCodeAt(0) - 97 - offset + 26) % 26 + 97);
                } else if (char >= 'A' && char <= 'Z') {
                    result += String.fromCharCode((char.charCodeAt(0) - 65 - offset + 26) % 26 + 65);
                } else {
                    result += char;
                }
            }
            document.getElementById('result').value = result;
        }

        // 向右偏移（核心功能：字母表右移，如a->b->c->d）
        function shiftRight() {
            const inputText = document.getElementById('inputText').value;
            const offset = parseInt(document.getElementById('offset').value);
            if (!validateOffset(offset)) return;
            let result = '';
            for (let i = 0; i < inputText.length; i++) {
                let char = inputText[i];
                if (char >= 'a' && char <= 'z') {
                    result += String.fromCharCode((char.charCodeAt(0) - 97 + offset) % 26 + 97);
                } else if (char >= 'A' && char <= 'Z') {
                    result += String.fromCharCode((char.charCodeAt(0) - 65 + offset) % 26 + 65);
                } else {
                    result += char;
                }
            }
            document.getElementById('result').value = result;
        }

        // 复制文本
        function copyText(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            showToast();
        }

        // 显示复制提示
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1500);
        }

        // 清空内容
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('result').value = '';
        }

        // 验证偏移量
        function validateOffset(offset) {
            if (!offset || offset < 1 || offset > 25) {
                alert('请输入有效的偏移位数（1-25）');
                return false;
            }
            return true;
        }

        // 快捷键支持：Ctrl+Enter向左偏移，Shift+Enter向右偏移
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                shiftLeft();
            } else if (e.shiftKey && e.key === 'Enter') {
                shiftRight();
            }
        });
    </script>
</body>
</html>
